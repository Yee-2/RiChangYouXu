<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>日常有序密码重置</title>
  </head>
  <body style="margin:0;background:#f8f3ec;color:#302a26;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px;background:#f8f3ec">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#fffdf9;border:1px solid #eee2d5;border-radius:20px">
          <tr><td style="padding:32px 28px 12px">
            <p style="margin:0 0 8px;color:#e77f62;font-size:13px;font-weight:700;letter-spacing:1px">日常有序 · 账号安全</p>
            <h1 style="margin:0;font-size:24px;line-height:1.4">验证后设置新密码</h1>
            <p style="margin:16px 0 0;color:#71665e;font-size:15px;line-height:1.7">请在密码设置页面输入下面的验证码，验证通过后即可设置新密码。</p>
          </td></tr>
          <tr><td align="center" style="padding:24px 28px">
            <div style="display:inline-block;padding:16px 28px;border-radius:14px;background:#fff2e9;color:#d96f54;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:32px;font-weight:700;letter-spacing:8px">{{ .Token }}</div>
            <p style="margin:14px 0 0;color:#8a8078;font-size:13px">6 位数字验证码 10 分钟内有效，且只能使用一次。</p>
          </td></tr>
          <tr><td style="padding:0 28px 30px;color:#8a8078;font-size:13px;line-height:1.7">
            如果你没有申请修改密码，请忽略这封邮件。请勿把验证码转发给任何人。
          </td></tr>
        </table>
        <p style="margin:16px 0 0;color:#9a9088;font-size:12px">这是一封系统邮件，请勿直接回复。</p>
      </td></tr>
    </table>
  </body>
</html>
