<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Renewly 邮箱验证</title>
  </head>
  <body style="margin:0;background:#f7f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 12px;background:#f7f7fb">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #e5e7eb;border-radius:20px">
          <tr><td style="padding:32px 28px 12px">
            <p style="margin:0 0 8px;color:#5b5bf0;font-size:13px;font-weight:700;letter-spacing:1px">RENEWLY · 邮箱验证 / EMAIL VERIFICATION</p>
            <h1 style="margin:0;font-size:24px;line-height:1.4">欢迎使用 Renewly</h1>
            <p style="margin:16px 0 0;color:#4b5563;font-size:15px;line-height:1.7">请在注册页面输入下面的 6 位验证码，完成邮箱验证并创建账号。<br><span style="color:#6b7280;font-size:13px">Enter the 6-digit code below to verify your email and activate your Renewly account.</span></p>
          </td></tr>
          <tr><td align="center" style="padding:24px 28px">
            <div style="display:inline-block;padding:16px 28px;border-radius:14px;background:#eef2ff;color:#4646d8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:32px;font-weight:700;letter-spacing:8px">{{ .Token }}</div>
            <p style="margin:14px 0 0;color:#6b7280;font-size:13px">验证码 10 分钟内有效，仅限本人使用一次。</p>
          </td></tr>
          <tr><td style="padding:0 28px 30px;color:#6b7280;font-size:13px;line-height:1.7">
            如果你没有注册 Renewly，请忽略这封邮件。请勿把验证码转发给任何人。
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
