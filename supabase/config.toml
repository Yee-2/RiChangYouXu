project_id = "obyqyzgycivgituobdzm"

[functions.admin-moderate]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.delete-content]
verify_jwt = true

[functions.admin-manage]
verify_jwt = true

[auth]
additional_redirect_urls = ["https://daily.yeecc.cn/", "https://daily.yeecc.cn", "https://admin.yeecc.cn/", "http://localhost:5173/admin", "http://127.0.0.1:5173/admin"]
site_url = "https://daily.yeecc.cn"
password_requirements = "letters_digits"
enable_leaked_password_protection = true

[auth.rate_limit]
email_sent = 1000

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 600
double_confirm_changes = false

[auth.email.notification.password_changed]
enabled = true
subject = "您的密码已被修改"

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_SMTP_PASSWORD)"
admin_email = "no-reply@yeecc.cn"
sender_name = "日常有序"

[auth.email.template.confirmation]
subject = "日常有序邮箱验证码"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "日常有序密码重置验证码"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "日常有序登录验证码"
content_path = "./supabase/templates/magic_link.html"

[auth.sms]
enable_confirmations = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.vector]
enabled = false
